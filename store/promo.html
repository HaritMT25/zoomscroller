<!doctype html>
<!-- The store's small promo tile (440x280): store\render.ps1 turns it into promo-440x280.png. -->
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 440px; height: 280px; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: #fff;
         background: linear-gradient(150deg, #0a5fb0 0%, #0096ff 70%, #3db0ff 100%);
         display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .badge { width: 104px; height: 104px; border-radius: 26px; background: #fff; display: flex; align-items: center; justify-content: center;
           box-shadow: 0 8px 22px rgba(0,0,0,.18); }
  .badge img { width: 92px; height: 92px; }
  h1 { font-size: 34px; font-weight: 700; margin-top: 18px; letter-spacing: -0.3px; }
  p { font-size: 16px; margin-top: 4px; opacity: .95; }
</style></head><body>
  <div class="badge"><img src="../extension/icons/icon128.png" alt=""></div>
  <h1>ZoomScroller</h1>
  <p>Touchpad pinch zoom for your mouse</p>
</body></html>
